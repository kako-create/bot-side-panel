<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BOT Side Panel</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="popup container">
	      <header class="popup__header">
	        <div class="popup__header-content">
	          <div class="header-top">
	            <div class="type-select screen-select" id="screen-select">
	              <button class="type-select__button" id="screen-button" type="button">
	                <span class="type-select__label" id="screen-label">Consulta & status</span>
	              </button>
	              <div class="type-select__menu" id="screen-menu" hidden></div>
	            </div>
	          </div>

	          <h1 class="text-title" id="app-title">Consulta & status</h1>
	        </div>
	        <img class="popup__logo" src="../assets/logo.png" alt="BOT" />
	      </header>

	      <div class="screen-root" id="screen-root"></div>

	      <template id="tpl-screen-consulta">
	        <section class="card surface status-card" id="status">
	          <div class="section-header">
	            <span class="semaforo" id="status-light"></span>
	            <h2 class="text-section-title">Sincronização</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="status-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="status-content" class="section-body">
	            <div class="status-grid">
	              <div class="status-row">
	                <span class="label">Bot</span>
	                <strong id="status-bot">-</strong>
	              </div>
	            </div>

	            <div class="status-metrics status-metrics--tight">
	              <div class="metric">
	                <span>Token</span>
	                <strong id="status-auth">-</strong>
	              </div>
	              <div class="metric">
	                <span>Sync</span>
	                <strong id="status-sync">-</strong>
	              </div>
	            </div>

	            <div class="status-metrics">
	              <div class="metric">
	                <span>Resumo</span>
	                <strong id="stat-summary-count">-</strong>
	              </div>
	              <div class="metric">
	                <span>Completo</span>
	                <strong id="stat-full-count">-</strong>
	              </div>
	              <div class="metric">
	                <span>Grupos</span>
	                <strong id="stat-groups-count">-</strong>
	              </div>
	              <div class="metric">
	                <span>Cache</span>
	                <strong id="stat-cache-size">-</strong>
	              </div>
	            </div>
	            <div class="actions actions-group">
	              <button id="sync-summary" class="btn btn--primary">Sinc. Busca rápida</button>
	              <button id="sync-full" class="btn btn--secondary actions-end">Sinc. Busca avançada</button>
	            </div>
	          </div>
	        </section>

	        <section class="card surface" id="quick-section" hidden>
	          <div class="section-header">
	            <span class="semaforo" id="quick-light"></span>
	            <h2 class="text-section-title">Busca rápida</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="quick-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="quick-content" class="section-body">
	            <div class="filters">
	              <label class="field">
	                <span>Tipo</span>
	                <div class="type-select" id="type-filter-select">
	                  <button class="type-select__button" id="type-filter-button" type="button">
	                    <span class="type-select__label">Todos os tipos</span>
	                  </button>
	                  <div class="type-select__menu" id="type-filter-menu" hidden></div>
	                </div>
	                <select id="type-filter" hidden>
	                  <option value="">Todos os tipos</option>
	                </select>
	              </label>
	              <label class="field">
	                <span>Buscar</span>
	                <input id="search-input" type="text" placeholder="Digite para filtrar (contém)" />
	              </label>
	            </div>
	            <div class="actions">
	              <button id="search-apply" class="btn btn--ghost btn--sm">Aplicar filtros</button>
	              <button class="btn btn--ghost btn--sm group-toggle" data-scope="quick" type="button">
	                Abrir grupos
	              </button>
	            </div>
	            <div class="groups" id="groups"></div>
	            <div class="empty" id="groups-empty">Nenhum grupo encontrado.</div>
	          </div>
	        </section>

	        <section class="card surface" id="advanced-section" hidden>
	          <div class="section-header">
	            <span class="semaforo" id="advanced-light"></span>
	            <h2 class="text-section-title">Busca avançada</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="advanced-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="advanced-content" class="section-body">
	            <div class="search-filters advanced-filters">
	              <div class="filter-group">
	                <label>Tipo de bloco</label>
	                <div class="type-select" id="advanced-type-select">
	                  <button class="type-select__button" id="advanced-type-button" type="button">
	                    <span class="type-select__label">Todos os tipos</span>
	                  </button>
	                  <div class="type-select__menu" id="advanced-type-menu" hidden></div>
	                </div>
	                <select id="advanced-type" hidden>
	                  <option value="">Todos os tipos</option>
	                </select>
	              </div>

	              <div class="filter-specific" id="filter-specific-container" hidden>
	                <div class="filter-specific-header">
	                  <label>Filtro específico do tipo</label>
	                  <label class="filter-specific-toggle">
	                    <input type="checkbox" id="filter-specific-toggle" />
	                    <span></span>
	                  </label>
	                </div>
	                <div id="filter-specific-content" class="filter-specific-content"></div>
	              </div>

	              <div class="filter-group">
	                <div class="filter-group-header">
	                  <label class="filter-label" for="advanced-text">Buscar por texto</label>
	                  <label class="checkbox" for="advanced-deep">
	                    <input type="checkbox" id="advanced-deep" />
	                    Busca completa
	                  </label>
	                </div>
	                <input type="text" id="advanced-text" placeholder="Buscar no título" />
	              </div>
	            </div>

	            <div class="actions actions-between">
	              <div class="actions-group">
	                <button id="advanced-search" class="btn btn--primary" type="button">Buscar</button>
	                <button id="advanced-clear" class="btn btn--ghost" type="button">Limpar</button>
	                <button class="btn btn--ghost btn--sm group-toggle" data-scope="advanced" type="button">
	                  Abrir grupos
	                </button>
	              </div>
	              <span class="hint" id="advanced-total">0 blocos encontrados</span>
	            </div>

	            <div id="advanced-results" class="search-results"></div>
	          </div>
	        </section>
	      </template>

	      <template id="tpl-screen-variaveis">
	        <section class="card surface status-card">
	          <div class="section-header">
	            <span class="semaforo" id="vars-light"></span>
	            <h2 class="text-section-title">Sincronização</h2>
	          </div>
	          <div class="section-body">
	            <div class="status-grid">
	              <div class="status-row">
	                <span class="label">Bot</span>
	                <strong id="vars-bot">-</strong>
	              </div>
	            </div>

	            <div class="status-metrics status-metrics--tight">
	              <div class="metric">
	                <span>Token</span>
	                <strong id="vars-auth">-</strong>
	              </div>
	              <div class="metric">
	                <span>Status</span>
	                <strong id="vars-status">-</strong>
	              </div>
	            </div>

	            <div class="status-metrics">
	              <div class="metric">
	                <span>Total</span>
	                <strong id="vars-total">0</strong>
	              </div>
	              <div class="metric">
	                <span>Última sync</span>
	                <strong id="vars-last-sync">-</strong>
	              </div>
	            </div>

	            <div class="actions actions-group">
	              <button id="vars-sync" class="btn btn--secondary" type="button">Sincronizar</button>
	            </div>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Variáveis</h2>
	          </div>
	          <div class="section-body">
	            <div id="vars-results" class="search-results"></div>
	          </div>
	        </section>
	      </template>

	      <template id="tpl-screen-tags">
	        <section class="card surface status-card">
	          <div class="section-header">
	            <span class="semaforo" id="tags-light"></span>
	            <h2 class="text-section-title">Sincronização</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="tags-status-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="tags-status-content" class="section-body">
	            <div class="status-grid">
	              <div class="status-row">
	                <span class="label">Bot</span>
	                <strong id="tags-bot">-</strong>
	              </div>
	            </div>

	            <div class="status-metrics status-metrics--tight">
	              <div class="metric">
	                <span>Token</span>
	                <strong id="tags-auth">-</strong>
	              </div>
	              <div class="metric">
	                <span>Status</span>
	                <strong id="tags-status">-</strong>
	              </div>
	            </div>

	            <div class="status-metrics">
	              <div class="metric">
	                <span>Total</span>
	                <strong id="tags-total">0</strong>
	              </div>
	              <div class="metric">
	                <span>Última sync</span>
	                <strong id="tags-last-sync">-</strong>
	              </div>
	            </div>

	            <div class="actions actions-group">
	              <button id="tags-sync" class="btn btn--secondary" type="button">Sincronizar</button>
	            </div>
	          </div>
	        </section>

	        <section class="card surface" id="tags-used-section">
	          <div class="section-header">
	            <h2 class="text-section-title">TAGs</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="tags-used-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="tags-used-content" class="section-body">
	            <div id="tags-used-results" class="search-results"></div>
	          </div>
	        </section>

	        <section class="card surface" id="tags-unused-section" hidden>
	          <div class="section-header">
	            <h2 class="text-section-title">TAGs não usadas</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="tags-unused-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="tags-unused-content" class="section-body">
	            <div id="tags-unused-results" class="search-results"></div>
	          </div>
	        </section>
	      </template>

	      <template id="tpl-screen-ia">
	        <section class="card surface status-card">
	          <div class="section-header">
	            <span class="semaforo" id="ia-light"></span>
	            <h2 class="text-section-title">Sincronização</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="ia-status-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="ia-status-content" class="section-body">
	            <div class="status-grid">
	              <div class="status-row">
	                <span class="label">Bot</span>
	                <strong id="ia-bot">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Token</span>
	                <strong id="ia-auth">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Status condições</span>
	                <strong id="ia-status">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Condições</span>
	                <strong id="ia-total">0</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Última sync condições</span>
	                <strong id="ia-last-sync">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Status intenções</span>
	                <strong id="ia-lex-status">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Intenções</span>
	                <strong id="ia-lex-total-intents">0</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Frases</span>
	                <strong id="ia-lex-total-samples">0</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Última sync intenções</span>
	                <strong id="ia-lex-last-sync">-</strong>
	              </div>
	            </div>

	            <p class="hint">
	              Disponível apenas para BOT. Use os dois syncs para atualizar condições e intenções no mesmo painel.
	            </p>

	            <div class="actions actions-group">
	              <button id="ia-sync" class="btn btn--secondary" type="button">Sinc Condições</button>
	              <button id="ia-lex-sync" class="btn btn--secondary" type="button">Sinc Intenções</button>
	            </div>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Condições</h2>
	            <div class="section-actions">
	              <button id="ia-groups-toggle" class="btn btn--ghost btn--sm" type="button">Fechar grupos</button>
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="ia-conditions-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="ia-conditions-content" class="section-body">
	            <div id="ia-results" class="search-results"></div>
	            <div class="actions actions-group">
	              <button id="ia-export" class="btn btn--primary" type="button">Exportar</button>
	            </div>
	          </div>
	        </section>
	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Intenções</h2>
	            <div class="section-actions">
	              <button id="ia-lex-groups-toggle" class="btn btn--ghost btn--sm" type="button">Abrir grupos</button>
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="ia-lex-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="ia-lex-content" class="section-body">
	            <div id="ia-lex-results" class="search-results"></div>
	            <div class="actions actions-group">
	              <button id="ia-lex-export" class="btn btn--primary" type="button">Exportar</button>
	            </div>
	          </div>
	        </section>
	      </template>

	      <template id="tpl-screen-funcoes">
	        <section class="card surface status-card">
	          <div class="section-header">
	            <span class="semaforo" id="funcoes-light"></span>
	            <h2 class="text-section-title">Funções (URA)</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="funcoes-status-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="funcoes-status-content" class="section-body">
	            <div class="status-grid">
	              <div class="status-row">
	                <span class="label">Bot</span>
	                <strong id="funcoes-bot">-</strong>
	              </div>
	            </div>

	            <div class="status-metrics status-metrics--tight">
	              <div class="metric">
	                <span>Token</span>
	                <strong id="funcoes-auth">-</strong>
	              </div>
	              <div class="metric">
	                <span>Status</span>
	                <strong id="funcoes-status">-</strong>
	              </div>
	            </div>

	            <div class="status-metrics">
	              <div class="metric">
	                <span>Total</span>
	                <strong id="funcoes-total">0</strong>
	              </div>
	              <div class="metric">
	                <span>Última sync</span>
	                <strong id="funcoes-last-sync">-</strong>
	              </div>
	            </div>

	            <p class="hint">
	              Esta tela é exclusiva do mode URA. As functions só aparecem quando você abrir essa área no builder.
	            </p>

	            <div class="actions actions-group">
	              <button id="funcoes-refresh" class="btn btn--primary" type="button">Atualizar</button>
	            </div>
	          </div>
	        </section>

	        <section class="card surface" id="funcoes-results-section">
	          <div class="section-header">
	            <h2 class="text-section-title">Funções</h2>
	            <div class="section-actions">
	              <button class="btn btn--ghost btn--sm section-toggle" data-target="funcoes-results-content" type="button">
	                Recolher
	              </button>
	            </div>
	          </div>
	          <div id="funcoes-results-content" class="section-body">
	            <div id="funcoes-results" class="search-results"></div>
	          </div>
	        </section>
	      </template>

	      <template id="tpl-screen-comparacao">
	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Comparação</h2>
	          </div>
	          <div class="section-body">
	            <div class="filters compare-selects">
	              <label class="field">
	                <span>Registro A (full sync)</span>
	                <select id="cmp-left">
	                  <option value="">Selecione um registro</option>
	                </select>
	              </label>
	              <label class="field">
	                <span>Registro B (full sync)</span>
	                <select id="cmp-right">
	                  <option value="">Selecione um registro</option>
	                </select>
	              </label>
	            </div>
	            <p class="muted" id="cmp-validation">Selecione dois registros para comparar.</p>
	            <div class="actions actions-group">
	              <button id="cmp-refresh" class="btn btn--primary" type="button">Atualizar lista</button>
	              <button id="cmp-run" class="btn btn--secondary actions-end" type="button" disabled>Comparar registros</button>
	            </div>
	          </div>
	        </section>

	        <section class="card surface" id="cmp-property-section" hidden>
	          <div class="section-header">
	            <h2 class="text-section-title">Filtro por propriedade</h2>
	          </div>
	          <div class="section-body">
	            <div class="filters compare-property-filters">
	              <label class="field">
	                <span>Campo alterado</span>
	                <select id="cmp-property-filter" disabled>
	                  <option value="">Todas as propriedades</option>
	                </select>
	              </label>
	            </div>
	            <div class="actions actions-group">
	              <button id="cmp-property-clear" class="btn btn--ghost btn--sm" type="button" disabled>
	                Limpar filtro
	              </button>
	            </div>
	            <p class="muted" id="cmp-property-summary">Execute uma comparação para listar as propriedades.</p>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Resultado da comparação</h2>
	            <div class="section-actions">
	              <button id="cmp-groups-toggle" class="btn btn--ghost btn--sm" type="button" disabled>
	                Abrir grupos
	              </button>
	            </div>
	          </div>
	          <div class="section-body">
	            <div class="status-grid">
	              <div class="status-row">
	                <span>Comparando</span>
	                <strong id="cmp-pair">-</strong>
	              </div>
	            </div>
	            <div id="cmp-summary" class="status-metrics"></div>
	            <div id="cmp-details" class="search-results"></div>
	          </div>
	        </section>
	      </template>

	      <template id="tpl-screen-review-tecnica">
	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Snapshot técnico</h2>
	          </div>
	          <div class="section-body">
	            <div class="status-grid">
	              <div class="status-row">
	                <span class="label">BOT atual</span>
	                <strong id="review-tech-bot">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Modo</span>
	                <strong id="review-tech-mode">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Token</span>
	                <strong id="review-tech-auth">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Full atual</span>
	                <strong id="review-tech-sync">-</strong>
	              </div>
	            </div>
	            <div class="status-metrics">
	              <div class="metric">
	                <span>Snapshots</span>
	                <strong id="review-tech-snapshot-count">0</strong>
	              </div>
	              <div class="metric">
	                <span>Último snapshot</span>
	                <strong id="review-tech-latest-snapshot">-</strong>
	              </div>
	            </div>
	            <div class="actions actions-group">
	              <button id="review-tech-capture" class="btn btn--primary" type="button">Criar snapshot</button>
	            </div>
	            <p class="settings-feedback settings-feedback--info" id="review-tech-feedback" hidden></p>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Gerar comparação</h2>
	          </div>
	          <div class="section-body">
	            <div class="filters">
	              <label class="field">
	                <span>Snapshot base</span>
	                <select id="review-tech-base-snapshot">
	                  <option value="">Selecione o snapshot base</option>
	                </select>
	              </label>
	              <label class="field">
	                <span>Comparar com</span>
	                <select id="review-tech-target-type">
	                  <option value="current">Base atual</option>
	                  <option value="snapshot">Outro snapshot</option>
	                </select>
	              </label>
	              <label class="field" id="review-tech-target-snapshot-field" hidden>
	                <span>Snapshot de comparação</span>
	                <select id="review-tech-target-snapshot">
	                  <option value="">Selecione o snapshot de comparação</option>
	                </select>
	              </label>
	            </div>
	            <p class="muted" id="review-tech-validation">
	              Selecione o snapshot base e escolha se a comparação será com a base atual ou com outro snapshot.
	            </p>
	            <div class="actions actions-group">
	              <button id="review-tech-compare" class="btn btn--secondary" type="button" disabled>
	                Gerar comparação
	              </button>
	              <button id="review-tech-export" class="btn btn--ghost actions-end" type="button" disabled>
	                Exportar Excel
	              </button>
	            </div>
	          </div>
	        </section>

	        <section class="card surface" id="review-tech-property-section" hidden>
	          <div class="section-header">
	            <h2 class="text-section-title">Filtro por propriedade</h2>
	          </div>
	          <div class="section-body">
	            <div class="filters compare-property-filters">
	              <label class="field">
	                <span>Campo alterado</span>
	                <select id="review-tech-property-filter" disabled>
	                  <option value="">Todas as propriedades</option>
	                </select>
	              </label>
	            </div>
	            <div class="actions actions-group">
	              <button id="review-tech-property-clear" class="btn btn--ghost btn--sm" type="button" disabled>
	                Limpar filtro
	              </button>
	            </div>
	            <p class="muted" id="review-tech-property-summary">
	              Execute uma comparação para listar as propriedades.
	            </p>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Resultado</h2>
	            <div class="section-actions">
	              <button id="review-tech-groups-toggle" class="btn btn--ghost btn--sm" type="button" disabled>
	                Abrir grupos
	              </button>
	            </div>
	          </div>
	          <div class="section-body">
	            <div class="status-grid">
	              <div class="status-row">
	                <span class="label">Snapshot base</span>
	                <strong id="review-tech-result-base">-</strong>
	              </div>
	              <div class="status-row">
	                <span class="label">Comparado com</span>
	                <strong id="review-tech-result-target">-</strong>
	              </div>
	            </div>
	            <div id="review-tech-summary" class="status-metrics"></div>
	            <div id="review-tech-details" class="search-results"></div>
	          </div>
	        </section>
	      </template>

	      <template id="tpl-screen-armazenamento">
	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Resumo</h2>
	            <div class="section-actions">
	              <button id="storage-refresh" class="btn btn--ghost btn--sm" type="button">Atualizar</button>
	            </div>
	          </div>
	          <div class="section-body">
	            <div class="status-metrics status-metrics--tight">
	              <div class="metric">
	                <span>Bots</span>
	                <strong id="storage-bots-count">0</strong>
	              </div>
	              <div class="metric">
	                <span>Cache</span>
	                <strong id="storage-cache-size">0 B</strong>
	              </div>
	            </div>
	            <p class="muted" id="storage-error" hidden></p>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Bots sincronizados</h2>
	            <div class="section-actions">
	              <button id="storage-groups-toggle" class="btn btn--ghost btn--sm" type="button" disabled>
	                Abrir grupos
	              </button>
	            </div>
	          </div>
	          <div class="section-body">
	            <div class="bots" id="storage-bots"></div>
	            <div class="muted" id="storage-empty" hidden>Nenhum bot sincronizado.</div>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Snapshots</h2>
	            <div class="section-actions">
	              <button id="storage-snapshots-toggle" class="btn btn--ghost btn--sm" type="button" disabled>
	                Abrir grupos
	              </button>
	            </div>
	          </div>
	          <div class="section-body">
	            <div class="bots" id="storage-snapshots"></div>
	            <div class="muted" id="storage-snapshots-empty" hidden>Nenhum snapshot encontrado.</div>
	          </div>
	        </section>
	      </template>

	      <template id="tpl-screen-acesso-rapido">
	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Resumo</h2>
	            <div class="section-actions">
	              <button id="quick-access-refresh" class="btn btn--ghost btn--sm" type="button">Atualizar</button>
	            </div>
	          </div>
	          <div class="section-body">
	            <div class="status-metrics status-metrics--tight">
	              <div class="metric">
	                <span>Registros</span>
	                <strong id="quick-access-records-count">0</strong>
	              </div>
	            </div>
	            <p class="muted" id="quick-access-error" hidden></p>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Acesso rápido</h2>
	          </div>
	          <div class="section-body">
	            <div class="quick-access-list" id="quick-access-list"></div>
	            <div class="muted" id="quick-access-empty" hidden>
	              Nenhum registro com modo definido foi encontrado.
	            </div>
	          </div>
	        </section>
	      </template>

		      <template id="tpl-screen-configuracoes">
		        <section class="card surface">
		          <div class="section-header">
		            <h2 class="text-section-title">Aparência</h2>
		          </div>
	          <div class="section-body settings-section">
	            <div class="settings-mode-group" id="settings-appearance-options"></div>
	            <div class="settings-theme-grid" id="settings-theme-grid"></div>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Sincronização automática</h2>
	          </div>
	          <div class="section-body settings-section">
	            <label class="settings-toggle-row">
	              <span class="settings-toggle-text">
	                <strong>AUTO_SYNC_ENABLED</strong>
	                <small>Executa sincronização automática ao detectar troca de BOT/URA.</small>
	              </span>
	              <span class="settings-switch">
	                <input id="settings-auto-sync-enabled" type="checkbox" />
	                <span class="settings-switch-track"></span>
	              </span>
	            </label>

	            <label class="settings-toggle-row">
	              <span class="settings-toggle-text">
	                <strong>AUTO_SYNC_FULL_ITEMS</strong>
	                <small id="settings-auto-sync-full-items-hint">
	                  Quando ativo, o auto sync executa também a busca avançada.
	                </small>
	              </span>
	              <span class="settings-switch">
	                <input id="settings-auto-sync-full-items" type="checkbox" />
	                <span class="settings-switch-track"></span>
	              </span>
	            </label>
	          </div>
	        </section>

	        <section class="card surface">
	          <div class="section-header">
	            <h2 class="text-section-title">Status</h2>
	            <div class="section-actions">
	              <button id="settings-reset" class="btn btn--ghost btn--sm" type="button">Restaurar padrão</button>
	            </div>
	          </div>
	          <div class="section-body">
	            <p class="settings-feedback settings-feedback--info" id="settings-feedback">
	              As alterações são salvas automaticamente.
	            </p>
		          </div>
		        </section>
		      </template>

		      <template id="tpl-screen-debug">
		        <section class="card surface">
		          <div class="section-header">
		            <h2 class="text-section-title">Debug</h2>
		          </div>
		          <div class="section-body">
		            <p class="muted" id="debug-summary">-</p>
		            <p class="hint">
		              Logs podem conter dados sensíveis. A exportação redige tokens/senhas, mas evite compartilhar sem
		              revisar.
		            </p>
		            <div class="actions">
		              <button id="debug-export" class="btn btn--primary" type="button">Exportar</button>
		              <button id="debug-clear" class="btn btn--ghost" type="button">Limpar</button>
		            </div>
		            <p class="settings-feedback settings-feedback--info" id="debug-feedback" hidden></p>
		          </div>
		        </section>
		      </template>
		    </main>

		    <script type="module" src="panel.js"></script>
		  </body>
		</html>
